services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
